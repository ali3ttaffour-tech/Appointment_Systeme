global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "spring-app"
    scheme: https
    tls_config:
      insecure_skip_verify: true
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8443"]

  - job_name: "ai-log-classifier"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-log-classifier:8000"]
