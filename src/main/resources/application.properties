spring.datasource.url=jdbc:mysql://mysql:3306/appointmentdb
spring.datasource.username=${db-username}
spring.datasource.password=${db-password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail-username}
spring.mail.password=${mail-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=your-email@gmail.com

server.port=8443
server.address=0.0.0.0

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${ssl-keystore-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=appointment-system

# ==========================
# Spring Boot Actuator
# ==========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# ==========================
# Spring Cloud Vault
# ==========================

spring.config.import=vault://

spring.cloud.vault.uri=http://vault:8200
spring.cloud.vault.token=root-token
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=appointment
