version: '3.8'

services:

  app:
    image: alihassan128/appointment-system:latest
    container_name: spring-app

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "8443:8443"

    depends_on:
      - mysql
      - ai-log-classifier

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointmentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # AI Log Classifier
      AI_LOG_CLASSIFIER_ENABLED: "true"
      AI_LOG_CLASSIFIER_URL: http://ai-log-classifier:8000/api/v1/classify
      AI_LOG_CLASSIFIER_TIMEOUT_MS: "800"

    networks:
      - network-appointment

    restart: always


  # ==========================================================
  # AI LOG CLASSIFIER
  # ==========================================================
  ai-log-classifier:
    build:
      context: ./ai-log-classifier/ai-log-classifier

    container_name: ai-log-classifier

    networks:
      - network-appointment

    restart: unless-stopped

    # لا نحتاج ports هنا.
    # Spring يصل للخدمة داخلياً عبر:
    # http://ai-log-classifier:8000
    #
    # وإذا أردت لاحقاً اختبارها من Ubuntu مباشرة،
    # يمكننا إضافة:
    # ports:
    #   - "8000:8000"


  apache:
    build: ./apache
    container_name: appointment-apache

    depends_on:
      - app

    ports:
      - "8088:80"

    networks:
      - network-appointment

    restart: always


  mysql:
    image: mysql:8.0
    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointmentdb

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - network-appointment


  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin

    restart: always

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "7070:80"

    networks:
      - network-appointment


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    restart: unless-stopped

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data

    ports:
      - "9000:9000"

    networks:
      - network-appointment


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor

    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    ports:
      - "8080:8080"

    networks:
      - network-appointment


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    depends_on:
      - cadvisor

    networks:
      - network-appointment


  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - network-appointment


volumes:
  mysql_data:
  prometheus_data:
  grafana_data:


networks:
  network-appointment:
    driver: bridge
