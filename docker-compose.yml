version: '3.8'

services:

  app:
    build: .
    container_name: spring-app

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "8443:8443"

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointmentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - network-appointment

    restart: always


  mysql:
    image: mysql:8.0
    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointmentdb

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - network-appointment


  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin

    restart: always

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "7070:80"

    networks:
      - network-appointment


  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    restart: unless-stopped

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data

    ports:
      - "9000:9000"

    networks:
      - network-appointment


volumes:
  mysql_data:


networks:
  network-appointment:
    driver: bridge
